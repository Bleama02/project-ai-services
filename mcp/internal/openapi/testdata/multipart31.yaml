openapi: 3.1.0
info:
  title: Multipart 3.1 API
  version: 1.0.0
paths:
  /jobs:
    post:
      operationId: create_job
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, files]
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
                files:
                  type: array
                  items:
                    type: string
                    contentMediaType: application/octet-stream
                target_language:
                  type: string
      responses:
        '200':
          description: OK
